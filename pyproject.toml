[project]
name = "spiking-resnet"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "pydantic>=2.13.4",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
]

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pytest>=9.1.1",
    "ruff>=0.13.0",
]

[tool.ruff]
target-version = "py312"
src = ["srn", "tests"]

[tool.mypy]
python_version = "3.12"
files = ["srn"]
ignore_missing_imports = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
